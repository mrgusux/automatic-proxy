name: 01 - Main Orchestrator

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-collector-main
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, validate and export proxies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache GeoIP Databases
        uses: actions/cache@v4
        id: geoip-cache
        with:
          path: data/geoip
          key: geoip-mmdb-${{ hashFiles('scripts/update_geoip_db.py') }}
          restore-keys: |
            geoip-mmdb-

      - name: Download GeoIP Databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          mkdir -p data/geoip
          python scripts/update_geoip_db.py || true

      - name: Run collector pipeline
        run: python -m src.main run --log-level INFO

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --staged --quiet; then
            echo "No proxy changes to commit."
          else
            git commit -m "chore(data): update proxy lists [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 3
            done
          fi
